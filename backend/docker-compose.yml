version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: social-connector-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: social_connector
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
